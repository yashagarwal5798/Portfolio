<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Yash Agarwal</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05070d">
  <!-- Root-relative paths so the page works at any broken URL depth.
       If the site is hosted in a sub-folder (for example a GitHub project page), prefix these with that folder. -->
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="bg__blob bg__blob--a"></span>
    <span class="bg__blob bg__blob--b"></span>
    <span class="bg__blob bg__blob--c"></span>
    <span class="bg__grid"></span>
  </div>
  <main class="hero" id="main">
    <div class="container hero__content">
      <p class="section-eyebrow">Error 404</p>
      <h1 class="hero__title">This page <span class="gradient-text">doesn’t exist.</span></h1>
      <p class="section-subtitle" style="margin-bottom:2rem">The link may be broken or the page may have moved.</p>
      <div class="hero__actions"><a class="btn btn--primary" href="/">Back to the portfolio</a></div>
    </div>
  </main>

</html>
